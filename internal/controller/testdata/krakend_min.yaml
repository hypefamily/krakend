apiVersion: krakend.nais.io/v1
kind: Krakend
metadata:
  labels:
    app.kubernetes.io/name: krakend
    app.kubernetes.io/instance: krakend-sample
    app.kubernetes.io/part-of: krakend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: krakend
  name: team1-min
spec:
  name: team1-min
  ingress:
    enabled: true
    className: nais-ingress
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production-cf
    hosts:
      - host: team1.nais.io
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: team1-tls
        hosts:
          - team1.nais.io
  partialsConfigMap:
    name: cm-partials
    endpointsKey: endpoints.tmpl
  deployment:
    replicaCount: 2
    image:
      tag: 2.4.3
    extraConfig:
      "telemetry/opentelemetry":
        service_name: krakend_prometheus_service
        metric_reporting_period: 1
        exporters:
          prometheus:
            - name: local_prometheus
              port: 9090
              process_metrics: true
              go_metricsL: true


